services:
  vllm:
    image: ${VLLM_IMAGE:-rocm/vllm:rocm7.14.1_rdna_ubuntu24.04_py3.14_pytorch_2.11_vllm_0.23.0}
    container_name: vllm-qwen3.5-2b
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    ipc: host
    network_mode: host
    environment:
      HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ${HOME}/.cache/vllm/triton:/root/.triton
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - >-
        exec vllm serve ${MODEL_ID:-Qwen/Qwen3.5-2B}
        --served-model-name ${SERVED_MODEL_NAME:-qwen}
        --dtype ${DTYPE:-float16}
        --max-model-len ${MAX_MODEL_LEN:-8192}
        --max-num-seqs ${MAX_NUM_SEQS:-32}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.80}
        --reasoning-parser qwen3
        --enable-auto-tool-choice
        --tool-call-parser qwen3_coder
        --language-model-only
        --host 0.0.0.0
        --port 8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: "no"

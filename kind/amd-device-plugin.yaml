# AMD GPU device plugin for this Kind lab.
# Upstream: https://github.com/ROCm/k8s-device-plugin
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amdgpu-device-plugin-daemonset
  namespace: kube-system
  labels:
    app.kubernetes.io/name: amd-gpu-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: amd-gpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amd-gpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
      containers:
        - name: device-plugin
          image: rocm/k8s-device-plugin:1.31.0.9
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: sys
              mountPath: /sys
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kind-gpu
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /dev/kfd
        containerPath: /dev/kfd
      - hostPath: /dev/dri
        containerPath: /dev/dri
    extraPortMappings:
      - containerPort: 30434
        hostPort: 8000
        protocol: TCP

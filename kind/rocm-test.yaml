apiVersion: v1
kind: Pod
metadata:
  name: rocm-test
spec:
  restartPolicy: Never
  containers:
    - name: rocm
      image: rocm/rocm-terminal:latest
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          echo "ROCm devices visible inside the Kind pod:"
          rocminfo | grep -E 'Name:|Marketing Name:'
      resources:
        requests:
          amd.com/gpu: 1
        limits:
          amd.com/gpu: 1
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        seccompProfile:
          type: Unconfined
